#install ebs driver
#IAM access to ebs
#service=clusterip
#service=clusterip:None=headless-service
#sc
#statefulset

apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector:
    purpose: stateful-set
    project: roboshop
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-headless
spec:
  clusterIP: None
  selector:
    purpose: stateful-set
    project: roboshop
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-dynamic
provisioner: ebs.csi.aws.com
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
spec:
  serviceName: "nginx-headless"
  replicas: 2
  selector:
    matchLabels:
      purpose: stateful-set
      project: roboshop
  template:
    metadata:
      labels:
        purpose: stateful-set
        project: roboshop
    spec:
      containers:
      - name: nginx
        image: registry.k8s.io/nginx-slim:0.21
        ports:
        - containerPort: 80
          name: web
        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
